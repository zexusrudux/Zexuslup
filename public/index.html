<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7M</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;padding-bottom:70px}
.top{background:#1a1a1a;padding:12px;text-align:center;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
.box{background:#1a1a1a;padding:20px;border-radius:12px;border:1px solid #333;max-width:400px;margin:30px auto}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0;background:#2a2a2a;color:#fff}
button{width:100%;padding:12px;border-radius:8px;border:0;background:#fff;color:#000;font-weight:bold;cursor:pointer}
#map{height:38vh}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px}
.card{background:#1e1e1e;border-radius:10px;overflow:hidden;border:1px solid #333;position:relative}
.card img{width:100%;height:130px;object-fit:cover}
.card .info{padding:5px}
.card .info b{font-size:12px}
.card .info p{font-size:10px;color:#0f0}
.dot{position:absolute;top:6px;left:6px;width:8px;height:8px;background:#0f0;border-radius:50%;border:2px solid #000}
.tab{display:none;padding:8px}
.tab.active{display:block}
.menu{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.menu div{text-align:center;font-size:11px;color:#666;cursor:pointer;flex:1}
.menu div.active{color:#fff}
.menu div span{font-size:20px;display:block}
.chat-item{background:#1e1e1e;padding:12px;margin:6px;border-radius:10px;display:flex;gap:10px;align-items:center;border:1px solid #222}
.chat-item img{width:45px;height:45px;border-radius:50%;object-fit:cover}
</style>
</head>
<body>

<div id="login" class="box">
<h2 style="text-align:center">7M PRIVADO</h2>
<input id="clave" type="password" placeholder="Clave: 7M2026">
<input id="nombre" placeholder="Tu nombre">
<input id="foto" placeholder="Link foto (opcional)">
<button onclick="login()">Entrar</button>
</div>

<div id="main" style="display:none">
<div class="top"><b id="titulo">CERCA</b></div>

<div id="tab-cerca" class="tab active">
<div id="map"></div>
<div id="lista" class="grid"></div>
</div>

<div id="tab-chats" class="tab">
<div id="chats"></div>
<p style="text-align:center;color:#555;margin-top:30px;font-size:12px">Tus chats con la banda aparecerán aquí</p>
</div>

<div id="tab-favs" class="tab">
<h4 style="padding:10px">Favoritos</h4>
<div id="favs" class="grid"></div>
</div>

<div id="tab-perfil" class="tab">
<div class="box" style="margin:10px auto">
<img id="miFoto" style="width:80px;height:80px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px">
<h3 id="miNombre" style="text-align:center"></h3>
<p style="text-align:center;color:#0f0;font-size:12px;margin:5px">● En línea - Valladolid</p>
<input id="editBio" placeholder="Tu bio... Ej: Tranqui, chelas">
<button onclick="guardarBio()">Guardar perfil</button>
<button onclick="salir()" style="background:#222;color:#fff;margin-top:8px">Salir</button>
</div>
</div>

<div class="menu">
<div class="active" onclick="go('cerca',this)"><span>◉</span>CERCA</div>
<div onclick="go('chats',this)"><span>💬</span>CHATS</div>
<div onclick="go('favs',this)"><span>★</span>FAVS</div>
<div onclick="go('perfil',this)"><span>👤</span>PERFIL</div>
</div>
</div>

<script>
const CLAVE="7M2026";
let perfiles = JSON.parse(localStorage.getItem('perfiles7M')||'[]');
let map;

function login(){
 if(document.getElementById('clave').value!==CLAVE) return alert('Clave mal');
 const n=document.getElementById('nombre').value; if(!n) return alert('Nombre');
 const f=document.getElementById('foto').value||`https://i.pravatar.cc/200?u=${n}`;
 let yo={nombre:n,foto:f,id:Date.now(),lat:20.6896+Math.random()*0.02-0.01,lng:-88.2014+Math.random()*0.02-0.01,bio:''};
 perfiles=perfiles.filter(p=>p.nombre!==n); perfiles.push(yo);
 localStorage.setItem('perfiles7M',JSON.stringify(perfiles));
 localStorage.setItem('yo7M',JSON.stringify(yo));
 iniciar();
}
function iniciar(){
 document.getElementById('login').style.display='none';
 document.getElementById('main').style.display='block';
 const yo=JSON.parse(localStorage.getItem('yo7M'));
 document.getElementById('miNombre').textContent=yo.nombre;
 document.getElementById('miFoto').src=yo.foto;
 setTimeout(()=>{ 
   map=L.map('map').setView([yo.lat,yo.lng],13);
   L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
   L.marker([yo.lat,yo.lng]).addTo(map).bindPopup('Tú');
   renderCerca();
 },300);
 renderChats(); renderFavs();
}
function renderCerca(){
 const yo=JSON.parse(localStorage.getItem('yo7M'));
 const lista=document.getElementById('lista'); lista.innerHTML='';
 perfiles.filter(p=>p.id!==yo.id).forEach(p=>{
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`<div class="dot"></div><img src="${p.foto}"><div class="info"><b>${p.nombre}</b><p>${(Math.random()*1.5).toFixed(1)} km</p></div>`;
  el.onclick=()=>{ if(confirm(`Chat con ${p.nombre}?`)){ addChat(p); go('chats',document.querySelectorAll('.menu div')[1]); } };
  lista.appendChild(el);
  L.marker([p.lat,p.lng]).addTo(map).bindPopup(p.nombre);
 });
 if(perfiles.length<=1) lista.innerHTML='<p style="grid-column:1/4;text-align:center;color:#555;padding:20px">Solo tú por ahora. Invita a la banda con clave 7M2026</p>';
}
function addChat(p){
 let chats=JSON.parse(localStorage.getItem('chats7M')||'[]');
 if(!chats.find(c=>c.nombre===p.nombre)){ chats.push(p); localStorage.setItem('chats7M',JSON.stringify(chats)); renderChats(); }
}
function renderChats(){
 let chats=JSON.parse(localStorage.getItem('chats7M')||'[]');
 const div=document.getElementById('chats'); div.innerHTML='';
 chats.forEach(c=>{ div.innerHTML+=`<div class="chat-item"><img src="${c.foto}"><div><b>${c.nombre}</b><br><span style="font-size:11px;color:#888">Toca para abrir WhatsApp</span></div></div>` });
}
function renderFavs(){ document.getElementById('favs').innerHTML='<p style="grid-column:1/3;color:#555">Dale tap largo a un perfil para fav ⭐</p>'; }
function go(tab,el){
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 document.getElementById('tab-'+tab).classList.add('active');
 document.querySelectorAll('.menu div').forEach(m=>m.classList.remove('active'));
 el.classList.add('active');
 document.getElementById('titulo').textContent=tab.toUpperCase();
 if(tab==='cerca' && map) setTimeout(()=>map.invalidateSize(),200);
}
function guardarBio(){ let yo=JSON.parse(localStorage.getItem('yo7M')); yo.bio=document.getElementById('editBio').value; localStorage.setItem('yo7M',JSON.stringify(yo)); alert('Guardado'); }
function salir(){ localStorage.removeItem('yo7M'); location.reload(); }
if(localStorage.getItem('yo7M')){ document.getElementById('login').style.display='none'; document.getElementById('main').style.display='block'; iniciar(); }
</script>
</body>
  </html>
