<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7M</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;padding-bottom:75px}
.top{background:#111;padding:12px;text-align:center;border-bottom:1px solid #222;position:sticky;top:0;z-index:20}
.box{background:#1a1a1a;padding:20px;border-radius:12px;border:1px solid #333;max-width:400px;margin:20px auto}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0;background:#2a2a2a;color:#fff}
button{width:100%;padding:12px;border-radius:8px;border:0;background:#fff;color:#000;font-weight:bold;cursor:pointer;margin-top:8px}
#map{height:30vh}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px}
.card{background:#1e1e1e;border-radius:10px;overflow:hidden;border:1px solid #333;position:relative;cursor:pointer}
.card img{width:100%;height:125px;object-fit:cover}
.tab{display:none}.tab.active{display:block}
.menu{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:90}
.menu div{text-align:center;font-size:11px;color:#666;flex:1;cursor:pointer}
.menu div.active{color:#fff}.menu div span{font-size:20px;display:block}
#modal{position:fixed;inset:0;background:#000;z-index:100;display:none;overflow-y:auto;padding-bottom:70px}
.perfil-header{height:320px;position:relative}
.perfil-header img{width:100%;height:100%;object-fit:cover}
.back{position:absolute;top:12px;left:12px;background:#000a;padding:8px 12px;border-radius:20px;cursor:pointer}
.tag{display:inline-block;background:#2a2a2a;border:1px solid #333;padding:4px 10px;border-radius:20px;font-size:11px;margin:3px}
.chat-box{height:40vh;overflow-y:auto;padding:10px;background:#0f0f0f;margin-top:10px;border-radius:10px}
.msg{margin:6px 0;padding:8px 10px;border-radius:12px;max-width:70%;font-size:13px}
.me{background:#fff;color:#000;margin-left:auto}
.other{background:#2a2a2a}
.chat-input{display:flex;gap:6px;margin-top:8px}
.chat-item{padding:12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #1a1a1a;cursor:pointer}
.chat-item img{width:48px;height:48px;border-radius:50%;object-fit:cover}
</style>
</head>
<body>

<div id="login" class="box">
<h2 style="text-align:center">7M PRIVADO</h2>
<p style="text-align:center;color:#666;font-size:11px;margin:8px">Clave: 7M2026</p>
<input id="clave" type="password" placeholder="Clave del grupo">
<input id="nombre" placeholder="Tu nombre">
<input id="foto" placeholder="Link foto (opcional)">
<button onclick="login()">Entrar</button>
</div>

<div id="main" style="display:none">
<div class="top"><b id="titulo">CERCA</b></div>
<div id="tab-cerca" class="tab active"><div id="map"></div><div style="padding:6px 10px;color:#666;font-size:11px">Más cerca primero</div><div id="lista" class="grid"></div></div>
<div id="tab-chats" class="tab"><div id="listaChats"></div></div>
<div id="tab-favs" class="tab"><div style="padding:20px;color:#555;text-align:center">Tus favs ⭐</div></div>
<div id="tab-perfil" class="tab">
<div style="height:220px;background:#222"><img id="miFotoBig" style="width:100%;height:100%;object-fit:cover"></div>
<div style="padding:15px">
<h2 id="miNombreBig"></h2>
<div id="miTags"></div>
<textarea id="editBio" placeholder="Tu bio"></textarea>
<input id="editGustos" placeholder="gym, chelas...">
<button onclick="guardarPerfil()">Guardar perfil</button>
<button onclick="localStorage.clear();location.reload()" style="background:#222;color:#fff">Salir</button>
</div>
</div>
<div class="menu">
<div class="active" onclick="go('cerca',this)"><span>◉</span>CERCA</div>
<div onclick="go('chats',this)"><span>💬</span>CHATS</div>
<div onclick="go('favs',this)"><span>★</span>FAVS</div>
<div onclick="go('perfil',this)"><span>👤</span>PERFIL</div>
</div>
</div>

<div id="modal">
<div class="perfil-header"><img id="vFoto"><div class="back" onclick="cerrarModal()">✕</div></div>
<div style="padding:15px">
<h2 id="vNombre"></h2><div id="vTags"></div>
<p id="vBio" style="color:#aaa;margin:10px 0"></p>
<p id="vDist" style="color:#0f0;font-size:12px"></p>
<button onclick="abrirChat()">💬 Mensaje</button>
<div id="chatBox" style="display:none">
<div id="mensajes" class="chat-box"></div>
<div class="chat-input"><input id="txtMsg" placeholder="Escribe..."><button onclick="enviarMsg()" style="width:80px">Enviar</button></div>
</div>
</div>
</div>

<script>
const CLAVE="7M2026";
let yo=JSON.parse(localStorage.getItem('yo7M')||'null');
let viendo=null, map, listaPerfiles=[];

async function login(){
 if(document.getElementById('clave').value!==CLAVE) return alert('Clave mal');
 const n=document.getElementById('nombre').value; if(!n) return alert('Nombre');
 const f=document.getElementById('foto').value||`https://i.pravatar.cc/400?u=${n}`;
 yo={id:Date.now().toString(),nombre:n,foto:f,lat:20.6896+Math.random()*0.01,lng:-88.2014+Math.random()*0.01,edad:'',rol:'Vers',bio:'Aquí andamos 7M',gustos:'tranqui'};
 localStorage.setItem('yo7M',JSON.stringify(yo));
 await fetch('/api/registro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(yo)});
 iniciar();
}
function iniciar(){
 document.getElementById('login').style.display='none'; document.getElementById('main').style.display='block';
 document.getElementById('miNombreBig').textContent=yo.nombre; document.getElementById('miFotoBig').src=yo.foto;
 document.getElementById('editBio').value=yo.bio||'';
 setTimeout(()=>{ map=L.map('map').setView([yo.lat,yo.lng],13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); L.marker([yo.lat,yo.lng]).addTo(map).bindPopup('Tú'); cargarCerca(); },400);
 cargarChats();
}
async function cargarCerca(){
 const res=await fetch(`/api/cerca?lat=${yo.lat}&lng=${yo.lng}&clave=${CLAVE}`).then(r=>r.json());
 listaPerfiles=res.filter(p=>p.nombre!==yo.nombre);
 const lista=document.getElementById('lista'); lista.innerHTML='';
 listaPerfiles.forEach(p=>{
   const el=document.createElement('div'); el.className='card';
   el.innerHTML=`<img src="${p.foto}"><div style="padding:4px"><b style="font-size:11px">${p.nombre}</b><br><span style="font-size:10px;color:#0f0">${(p._d||0).toFixed(2)} km</span></div>`;
   el.onclick=()=>verPerfil(p); lista.appendChild(el);
   if(map) L.marker([p.lat,p.lng]).addTo(map).bindPopup(`${p.nombre} - ${(p._d||0).toFixed(2)}km`);
 });
}
function verPerfil(p){
 viendo=p; document.getElementById('modal').style.display='block';
 document.getElementById('vFoto').src=p.foto; document.getElementById('vNombre').textContent=p.nombre;
 document.getElementById('vBio').textContent=p.bio||''; document.getElementById('vDist').textContent=`📍 ${(p._d||0).toFixed(2)} km de ti`;
 document.getElementById('vTags').innerHTML=(p.gustos||'').split(',').map(g=>`<span class="tag">${g.trim()}</span>`).join('');
 document.getElementById('chatBox').style.display='none'; cargarMensajes();
}
function cerrarModal(){ document.getElementById('modal').style.display='none'; }
function abrirChat(){ document.getElementById('chatBox').style.display='block'; cargarMensajes(); }
async function cargarMensajes(){
 if(!viendo) return;
 const key=[yo.nombre,viendo.nombre].sort().join('-');
 const msgs=await fetch(`/api/mensajes/${key}`).then(r=>r.json());
 const div=document.getElementById('mensajes'); div.innerHTML='';
 msgs.forEach(m=>{ div.innerHTML+=`<div class="msg ${m.de===yo.nombre?'me':'other'}">${m.texto}</div>` });
 div.scrollTop=div.scrollHeight;
}
async function enviarMsg(){
 const txt=document.getElementById('txtMsg').value; if(!txt||!viendo) return;
 const key=[yo.nombre,viendo.nombre].sort().join('-');
 await fetch(`/api/mensajes/${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({de:yo.nombre,text:txt})});
 document.getElementById('txtMsg').value=''; cargarMensajes(); cargarChats();
}
async function cargarChats(){
 // muestra últimos chats - simple
 const div=document.getElementById('listaChats'); div.innerHTML='<p style="text-align:center;color:#555;padding:20px">Tus conversaciones aparecerán aquí</p>';
}
function go(tab,el){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('tab-'+tab).classList.add('active'); document.querySelectorAll('.menu div').forEach(m=>m.classList.remove('active')); el.classList.add('active'); document.getElementById('titulo').textContent=tab.toUpperCase(); if(tab==='cerca'&&map) setTimeout(()=>map.invalidateSize(),200); if(tab==='cerca') cargarCerca(); }
async function guardarPerfil(){
 yo.bio=document.getElementById('editBio').value; yo.gustos=document.getElementById('editGustos').value;
 localStorage.setItem('yo7M',JSON.stringify(yo));
 await fetch('/api/registro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(yo)});
 alert('Guardado');
}
if(yo){ document.getElementById('login').style.display='none'; document.getElementById('main').style.display='block'; iniciar(); }
</script>
</body>
                                       </html>
