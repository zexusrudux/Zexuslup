<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7M Privado</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui;margin:0}
body{background:#0f0f0f;color:#fff;padding:10px}
.box{background:#1a1a1a;padding:20px;border-radius:12px;border:1px solid #333;max-width:400px;margin:20px auto}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:0;background:#2a2a2a;color:#fff}
button{width:100%;padding:12px;border-radius:8px;border:0;background:#fff;color:#000;font-weight:bold;cursor:pointer;margin-top:10px}
#app{display:none}
#map{height:40vh;border-radius:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#1e1e1e;border-radius:10px;padding:8px;border:1px solid #333;text-align:center}
.card img{width:100%;height:110px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>

<div id="login" class="box">
  <h2 style="text-align:center">7M PRIVADO</h2>
  <p style="text-align:center;color:#aaa;font-size:12px;margin:10px 0">Solo compas - 18+</p>
  <input id="clave" placeholder="Clave del grupo (7M2026)" type="password">
  <input id="nombre" placeholder="Tu nombre">
  <input id="foto" placeholder="Link de tu foto (instagram, imgur)">
  <button onclick="entrar()">Entrar</button>
  <p style="font-size:10px;color:#666;margin-top:10px;text-align:center">Al entrar confirmas 18+ y que es solo entre amigos</p>
</div>

<div id="app">
  <h3 style="text-align:center">Cerca de ti - Valladolid</h3>
  <div id="map"></div>
  <div id="lista" class="grid"></div>
</div>

<script>
const CLAVE_OK = "7M2026";
let perfiles = JSON.parse(localStorage.getItem('perfiles7M') || '[]');

function entrar(){
  const c = document.getElementById('clave').value;
  const n = document.getElementById('nombre').value;
  const f = document.getElementById('foto').value || `https://i.pravatar.cc/200?u=${n}`;
  if(c !== CLAVE_OK){ alert('Clave incorrecta bro'); return; }
  if(!n){ alert('Pon tu nombre'); return; }
  
  const yo = {nombre:n, foto:f, id:Date.now(), lat:20.6896+Math.random()*0.01, lng:-88.2014+Math.random()*0.01};
  perfiles = perfiles.filter(p=>p.nombre!==n);
  perfiles.push(yo);
  localStorage.setItem('perfiles7M', JSON.stringify(perfiles));
  localStorage.setItem('yo7M', JSON.stringify(yo));
  
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  iniciarMapa();
}

function iniciarMapa(){
  const yo = JSON.parse(localStorage.getItem('yo7M'));
  const map = L.map('map').setView([yo.lat, yo.lng],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  L.marker([yo.lat, yo.lng]).addTo(map).bindPopup('Tú').openPopup();
  
  const lista = document.getElementById('lista');
  lista.innerHTML='';
  perfiles.forEach(p=>{
    if(p.id===yo.id) return;
    const d = document.createElement('div');
    d.className='card';
    d.innerHTML=`<img src="${p.foto}"><h4>${p.nombre}</h4><button onclick="alert('Habla con ${p.nombre} por Whats')">WhatsApp</button>`;
    lista.appendChild(d);
    L.marker([p.lat, p.lng]).addTo(map).bindPopup(p.nombre);
  });
  if(perfiles.length===1) lista.innerHTML='<p style="color:#666;text-align:center;grid-column:1/3">Aún solo tú. Pásale el link a tus compas con la clave 7M2026</p>';
}

// auto-login si ya entró
if(localStorage.getItem('yo7M')){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  setTimeout(iniciarMapa,300);
}
</script>
</body>
</html>
