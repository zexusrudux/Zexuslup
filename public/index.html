<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>7M Valladolid</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="login" class="box" style="margin-top:20vh">
  <h2>7M Valladolid</h2>
  <input id="nombre" placeholder="Tu nombre">
  <input id="foto" placeholder="Link foto (opcional)">
  <input id="clave" placeholder="Clave">
  <button onclick="App.login()">Entrar</button>
</div>

<div id="main" style="display:none">
  <div class="top" id="titulo">CERCA</div>
  <div id="tab-cerca" class="tab active"><div id="map"></div><div id="cerca" class="grid"></div></div>
  <div id="tab-chats" class="tab"><div id="listaChats"></div></div>
  <div id="tab-favs" class="tab"><div id="favs" class="grid"></div></div>
  <div id="tab-perfil" class="tab"></div>
  
  <div class="menu">
    <div class="active" onclick="App.go('cerca',this)"><span>📍</span>CERCA</div>
    <div onclick="App.go('chats',this)"><span>💬</span>CHATS</div>
    <div onclick="App.go('favs',this)"><span>★</span>FAVS</div>
    <div onclick="App.go('perfil',this)"><span>👤</span>PERFIL</div>
  </div>
</div>

<div id="modal" style="display:none;position:fixed;inset:0;background:#000;z-index:9999;overflow-y:auto"></div>

<div id="modalChat" style="display:none;position:fixed;inset:0;background:#000;z-index:10000;flex-direction:column">
  <div id="chatHeader" style="background:#111;padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222"></div>
  <div id="mensajes" class="chat-box" style="flex:1;height:auto;border:0;border-radius:0;background:#080808;overflow-y:auto;padding:12px"></div>
  <div id="albumPreview" class="album-preview" style="padding:6px 10px;background:#111;display:flex;gap:8px;overflow-x:auto"></div>
  <div class="chat-input-wa" style="margin:0;border-radius:0;border:0;border-top:1px solid #222;padding:8px 10px 20px;background:#111;display:flex;gap:8px;align-items:center">
    <label for="fileAlbum" style="font-size:22px;padding:8px;cursor:pointer">📷</label>
    <input id="fileAlbum" type="file" multiple accept="image/*" style="display:none" onchange="Chat.previewAlbum(this)">
    <input id="txtMsg" placeholder="Mensaje..." style="flex:1;background:#222;border-radius:20px;padding:12px;border:0;color:#fff" onkeypress="if(event.key==='Enter')Chat.enviar()">
    <button onclick="Chat.enviar()" style="width:44px;height:44px;border-radius:50%;margin:0;padding:0;background:#fff;color:#000">➤</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api.js"></script>
<script src="js/mapa.js"></script>
<script src="js/cerca.js"></script>
<script src="js/perfil.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>
</body>
  </html>
