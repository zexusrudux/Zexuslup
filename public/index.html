<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CERCA 7M - Valladolid</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f0f0f;color:#fff}
header{padding:15px;background:#1a1a1a;text-align:center;border-bottom:1px solid #333;position:sticky;top:0;z-index:999}
header h1{font-size:18px;letter-spacing:2px}
#map{height:45vh;width:100%}
#lista{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#1e1e1e;border-radius:12px;padding:10px;border:1px solid #333}
.card img{width:100%;height:120px;object-fit:cover;border-radius:8px;background:#333}
.card h3{font-size:14px;margin:6px 0 2px}
.card p{font-size:11px;color:#0f0}
.card button{width:100%;margin-top:6px;background:#fff;color:#000;border:0;padding:6px;border-radius:6px;font-weight:bold;cursor:pointer}
#chat{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-top:1px solid #333;padding:10px;display:none}
#msgs{height:120px;overflow-y:auto;margin-bottom:8px;font-size:13px}
#chat input{width:80%;padding:8px;border-radius:6px;border:0;background:#2a2a2a;color:#fff}
#chat button{width:18%;padding:8px;border-radius:6px;border:0;background:#fff;font-weight:bold}
#verif{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
#verif div{background:#1a1a1a;padding:25px;border-radius:12px;border:1px solid #333}
</style>
</head>
<body>

<div id="verif">
  <div>
    <h2>18+ SOLO ADULTOS</h2>
    <p style="margin:10px 0;color:#aaa;font-size:13px">Esta app es solo para mayores de 18. Al continuar confirmas que eres mayor.</p>
    <button onclick="entrar()" style="padding:10px 20px;border-radius:8px;border:0;background:#fff;font-weight:bold;cursor:pointer;width:100%">SOY MAYOR DE 18 - ENTRAR</button>
  </div>
</div>

<header><h1>CERCA 7M - VALLADOLID</h1></header>
<div id="map"></div>
<div id="lista"></div>

<div id="chat">
  <div id="msgs"></div>
  <input id="txt" placeholder="Escribe un mensaje...">
  <button onclick="enviar()">Enviar</button>
</div>

<script>
let map, miLat=20.689, miLng=-88.201, socket;

function entrar(){
  document.getElementById('verif').style.display='none';
  iniciar();
}

function iniciar(){
  socket = io();
  map = L.map('map').setView([20.6896, -88.2014], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      miLat = pos.coords.latitude; miLng = pos.coords.longitude;
      map.setView([miLat, miLng], 14);
      L.marker([miLat, miLng]).addTo(map).bindPopup('Tú estás aquí').openPopup();
      cargarCerca();
    }, ()=> cargarCerca());
  } else { cargarCerca(); }

  socket.on('mensaje', data=>{
    const d = document.createElement('div');
    d.textContent = data.user + ': ' + data.text;
    document.getElementById('msgs').appendChild(d);
  });
}

async function cargarCerca(){
  // cuando conectes Postgres, cambia esto por fetch real
  const res = await fetch(`/api/cerca?lat=${miLat}&lng=${miLng}`).then(r=>r.json()).catch(()=>[
    {id:1,nombre:"Alex 24", distancia:"0.3 km", foto:"https://i.pravatar.cc/200?img=12"},
    {id:2,nombre:"Mau 26", distancia:"0.6 km", foto:"https://i.pravatar.cc/200?img=15"},
    {id:3,nombre:"Leo 23", distancia:"1.1 km", foto:"https://i.pravatar.cc/200?img=8"},
    {id:4,nombre:"Fer 27", distancia:"1.4 km", foto:"https://i.pravatar.cc/200?img=33"}
  ]);

  const lista = document.getElementById('lista');
  lista.innerHTML='';
  res.forEach(p=>{
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML=`<img src="${p.foto}"><h3>${p.nombre}</h3><p>● ${p.distancia}</p><button onclick="abrirChat('${p.nombre}')">Mensaje</button>`;
    lista.appendChild(card);
    if(p.lat) L.marker([p.lat||miLat+0.001, miLng]).addTo(map);
  });
}

let chatCon='';
function abrirChat(nombre){
  chatCon=nombre;
  document.getElementById('chat').style.display='block';
  document.getElementById('msgs').innerHTML=`<b>Chat con ${nombre}</b><br>`;
}
function enviar(){
  const t = document.getElementById('txt');
  if(!t.value) return;
  socket.emit('mensaje', {user:'Tú', text:t.value});
  t.value='';
}
</script>
</body>
      </html>
