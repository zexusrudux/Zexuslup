<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7M</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;padding-bottom:75px}
.top{background:#111;padding:12px;text-align:center;border-bottom:1px solid #222;position:sticky;top:0;z-index:10;letter-spacing:1px}
.box{background:#1a1a1a;padding:20px;border-radius:12px;border:1px solid #333;max-width:400px;margin:20px auto}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0;background:#2a2a2a;color:#fff}
textarea{height:60px;resize:none}
button{width:100%;padding:12px;border-radius:8px;border:0;background:#fff;color:#000;font-weight:bold;cursor:pointer;margin-top:8px}
#map{height:35vh}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px}
.card{background:#1e1e1e;border-radius:10px;overflow:hidden;border:1px solid #333;position:relative}
.card img{width:100%;height:130px;object-fit:cover}
.tab{display:none}.tab.active{display:block}
.menu{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.menu div{text-align:center;font-size:11px;color:#666;cursor:pointer;flex:1}
.menu div.active{color:#fff}.menu div span{font-size:20px;display:block}
/* PERFIL PRO */
.perfil-header{position:relative;height:220px;background:#222}
.perfil-header img{width:100%;height:100%;object-fit:cover}
.perfil-header .edit-foto{position:absolute;bottom:10px;right:10px;background:#000a;padding:6px 10px;border-radius:20px;font-size:11px;border:1px solid #444}
.perfil-body{padding:15px}
.perfil-stats{display:flex;gap:15px;margin:12px 0;font-size:12px}
.perfil-stats b{color:#fff}
.perfil-tag{display:inline-block;background:#2a2a2a;border:1px solid #333;padding:4px 10px;border-radius:20px;font-size:11px;margin:3px}
</style>
</head>
<body>

<div id="login" class="box">
<h2 style="text-align:center">7M PRIVADO</h2>
<input id="clave" type="password" placeholder="Clave: 7M2026">
<input id="nombre" placeholder="Tu nombre">
<input id="foto" placeholder="Link foto principal">
<button onclick="login()">Entrar</button>
</div>

<div id="main" style="display:none">
<div class="top"><b id="titulo">CERCA</b></div>

<div id="tab-cerca" class="tab active"><div id="map"></div><div id="lista" class="grid"></div></div>
<div id="tab-chats" class="tab"><div id="chats"></div></div>
<div id="tab-favs" class="tab"><div id="favs" class="grid"></div></div>

<div id="tab-perfil" class="tab">
  <div class="perfil-header">
    <img id="miFotoBig" src="">
    <div class="edit-foto" onclick="cambiarFoto()">✏️ Cambiar foto</div>
  </div>
  <div class="perfil-body">
    <h2 id="miNombreBig"></h2>
    <div class="perfil-stats">
      <span>🟢 <b>En línea</b></span>
      <span>📍 <b id="miDist">Valladolid</b></span>
      <span>👁️ <b>42 vistas</b></span>
    </div>
    <div id="miTags"></div>
    <p id="miBioText" style="color:#aaa;font-size:13px;margin:12px 0;line-height:1.4"></p>
    
    <h4 style="margin:15px 0 8px;font-size:12px;color:#888;letter-spacing:1px">EDITAR PERFIL</h4>
    <input id="editEdad" type="number" placeholder="Edad">
    <select id="editRol"><option value="">Rol</option><option>Vers</option><option>Activo</option><option>Pasivo</option><option>Tranqui</option></select>
    <input id="editAltura" placeholder="Estatura ej: 1.75">
    <textarea id="editBio" placeholder="Bio: que buscas, gustos..."></textarea>
    <input id="editGustos" placeholder="Tags ej: gym, chelas, tranqui (separado por comas)">
    <button onclick="guardarPerfil()">Guardar cambios</button>
    <button onclick="salir()" style="background:#222;color:#fff">Cerrar sesión</button>
  </div>
</div>

<div class="menu">
<div class="active" onclick="go('cerca',this)"><span>◉</span>CERCA</div>
<div onclick="go('chats',this)"><span>💬</span>CHATS</div>
<div onclick="go('favs',this)"><span>★</span>FAVS</div>
<div onclick="go('perfil',this)"><span>👤</span>PERFIL</div>
</div>
</div>

<script>
const CLAVE="7M2026";
let perfiles=JSON.parse(localStorage.getItem('perfiles7M')||'[]'); let map;
function login(){
 if(document.getElementById('clave').value!==CLAVE) return alert('Clave mal');
 const n=document.getElementById('nombre').value; if(!n) return alert('Nombre');
 const f=document.getElementById('foto').value||`https://i.pravatar.cc/400?u=${n}`;
 let yo={nombre:n,foto:f,id:Date.now(),lat:20.6896+Math.random()*0.02-0.01,lng:-88.2014+Math.random()*0.02-0.01,edad:'',rol:'',bio:'Solo entre compas 7M',gustos:'',altura:''};
 perfiles=perfiles.filter(p=>p.nombre!==n); perfiles.push(yo);
 localStorage.setItem('perfiles7M',JSON.stringify(perfiles)); localStorage.setItem('yo7M',JSON.stringify(yo)); iniciar();
}
function iniciar(){
 document.getElementById('login').style.display='none'; document.getElementById('main').style.display='block';
 const yo=JSON.parse(localStorage.getItem('yo7M'));
 document.getElementById('miNombreBig').textContent=yo.nombre; document.getElementById('miFotoBig').src=yo.foto;
 document.getElementById('miBioText').textContent=yo.bio||'Sin bio';
 document.getElementById('editEdad').value=yo.edad||''; document.getElementById('editRol').value=yo.rol||''; document.getElementById('editBio').value=yo.bio||''; document.getElementById('editGustos').value=yo.gustos||''; document.getElementById('editAltura').value=yo.altura||'';
 renderTags(yo); setTimeout(()=>{ map=L.map('map').setView([yo.lat,yo.lng],13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); renderCerca(); },300); renderChats();
}
function renderTags(yo){
 let html=''; if(yo.edad) html+=`<span class="perfil-tag">${yo.edad}</span>`; if(yo.rol) html+=`<span class="perfil-tag">${yo.rol}</span>`; if(yo.altura) html+=`<span class="perfil-tag">${yo.altura}</span>`; if(yo.gustos) yo.gustos.split(',').forEach(g=>{ if(g.trim()) html+=`<span class="perfil-tag">${g.trim()}</span>` });
 document.getElementById('miTags').innerHTML=html;
}
function renderCerca(){
 const yo=JSON.parse(localStorage.getItem('yo7M')); const lista=document.getElementById('lista'); lista.innerHTML='';
 perfiles.filter(p=>p.id!==yo.id).forEach(p=>{ const el=document.createElement('div'); el.className='card'; el.innerHTML=`<img src="${p.foto}"><div style="padding:5px"><b style="font-size:12px">${p.nombre} ${p.edad||''}</b><br><span style="font-size:10px;color:#0f0">${p.rol||'En línea'}</span></div>`; lista.appendChild(el); if(map) L.marker([p.lat,p.lng]).addTo(map).bindPopup(p.nombre); });
}
function renderChats(){ document.getElementById('chats').innerHTML='<p style="text-align:center;color:#555;padding:30px">Chats en vivo próximamente - por mientras se ven en Cerca</p>'; }
function go(tab,el){
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('tab-'+tab).classList.add('active');
 document.querySelectorAll('.menu div').forEach(m=>m.classList.remove('active')); el.classList.add('active');
 document.getElementById('titulo').textContent=tab.toUpperCase(); if(tab==='cerca'&&map) setTimeout(()=>map.invalidateSize(),200);
}
function guardarPerfil(){
 let yo=JSON.parse(localStorage.getItem('yo7M')); yo.edad=document.getElementById('editEdad').value; yo.rol=document.getElementById('editRol').value; yo.bio=document.getElementById('editBio').value; yo.gustos=document.getElementById('editGustos').value; yo.altura=document.getElementById('editAltura').value;
 localStorage.setItem('yo7M',JSON.stringify(yo)); perfiles=perfiles.map(p=>p.id===yo.id?yo:p); localStorage.setItem('perfiles7M',JSON.stringify(perfiles));
 document.getElementById('miBioText').textContent=yo.bio; renderTags(yo); alert('Perfil guardado bro');
}
function cambiarFoto(){ let url=prompt('Pega nuevo link de foto:'); if(url){ let yo=JSON.parse(localStorage.getItem('yo7M')); yo.foto=url; localStorage.setItem('yo7M',JSON.stringify(yo)); perfiles=perfiles.map(p=>p.id===yo.id?yo:p); localStorage.setItem('perfiles7M',JSON.stringify(perfiles)); document.getElementById('miFotoBig').src=url; } }
function salir(){ localStorage.removeItem('yo7M'); location.reload(); }
if(localStorage.getItem('yo7M')){ document.getElementById('login').style.display='none'; document.getElementById('main').style.display='block'; iniciar(); }
</script>
</body>
 </html>
