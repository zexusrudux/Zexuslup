<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7M</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;padding-bottom:75px}
.top{background:#111;padding:12px;text-align:center;border-bottom:1px solid #222;position:sticky;top:0;z-index:20}
.box{background:#1a1a1a;padding:20px;border-radius:12px;border:1px solid #333;max-width:400px;margin:20px auto}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0;background:#2a2a2a;color:#fff}
button{width:100%;padding:12px;border-radius:8px;border:0;background:#fff;color:#000;font-weight:bold;cursor:pointer;margin-top:8px}
#map{height:32vh}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px}
.card{background:#1e1e1e;border-radius:10px;overflow:hidden;border:1px solid #333;position:relative;cursor:pointer}
.card img{width:100%;height:125px;object-fit:cover}
.card.info{padding:5px}
.dot{position:absolute;top:6px;left:6px;width:8px;height:8px;background:#0f0;border-radius:50%}
.tab{display:none}.tab.active{display:block}
.menu{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.menu div{text-align:center;font-size:11px;color:#666;cursor:pointer;flex:1}
.menu div.active{color:#fff}.menu div span{font-size:20px;display:block}
/* MODAL PERFIL */
#modal{position:fixed;inset:0;background:#000;z-index:100;display:none;overflow-y:auto;padding-bottom:70px}
.perfil-header{height:320px;position:relative;background:#222}
.perfil-header img{width:100%;height:100%;object-fit:cover}
.perfil-header.back{position:absolute;top:12px;left:12px;background:#000a;padding:8px 12px;border-radius:20px}
.perfil-body{padding:15px}
.tag{display:inline-block;background:#2a2a2a;border:1px solid #333;padding:4px 10px;border-radius:20px;font-size:11px;margin:3px}
/* CHAT */
.chat-box{height:55vh;overflow-y:auto;padding:10px;background:#0f0f0f}
.msg{margin:6px 0;padding:8px 10px;border-radius:12px;max-width:70%;font-size:13px}
.me{background:#fff;color:#000;margin-left:auto}
.other{background:#2a2a2a}
.chat-input{display:flex;gap:6px;padding:8px;background:#111;position:sticky;bottom:0}
.chat-input input{flex:1}
.chat-item{padding:12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #1a1a1a;cursor:pointer}
.chat-item img{width:50px;height:50px;border-radius:50%;object-fit:cover}
</style>
</head>
<body>

<div id="login" class="box">
<h2 style="text-align:center">7M PRIVADO</h2>
<input id="clave" type="password" placeholder="Clave: 7M2026">
<input id="nombre" placeholder="Tu nombre">
<input id="foto" placeholder="Link foto">
<button onclick="login()">Entrar</button>
</div>

<div id="main" style="display:none">
<div class="top"><b id="titulo">CERCA</b></div>

<div id="tab-cerca" class="tab active">
<div id="map"></div>
<div style="padding:8px 10px;font-size:11px;color:#666">Ordenado del más cerca al más lejos</div>
<div id="lista" class="grid"></div>
</div>

<div id="tab-chats" class="tab"><div id="listaChats"></div></div>
<div id="tab-favs" class="tab"><div id="favs" class="grid"></div></div>
<div id="tab-perfil" class="tab">
<div style="height:220px;background:#222"><img id="miFotoBig" style="width:100%;height:100%;object-fit:cover"></div>
<div style="padding:15px">
<h2 id="miNombreBig"></h2>
<div id="miTags"></div>
<p id="miBioText" style="color:#aaa;margin:10px 0;font-size:13px"></p>
<input id="editEdad" type="number" placeholder="Edad"><select id="editRol"><option>Vers</option><option>Activo</option><option>Pasivo</option><option>Tranqui</option></select>
<textarea id="editBio" placeholder="Tu bio"></textarea>
<input id="editGustos" placeholder="Tags: gym, chelas...">
<button onclick="guardarPerfil()">Guardar</button>
</div>
</div>

<div class="menu">
<div class="active" onclick="go('cerca',this)"><span>◉</span>CERCA</div>
<div onclick="go('chats',this)"><span>💬</span>CHATS</div>
<div onclick="go('favs',this)"><span>★</span>FAVS</div>
<div onclick="go('perfil',this)"><span>👤</span>PERFIL</div>
</div>
</div>

<!-- MODAL VER PERFIL + CHAT -->
<div id="modal">
<div class="perfil-header"><img id="vFoto"><div class="back" onclick="cerrarModal()">✕ Cerrar</div></div>
<div class="perfil-body">
<h2 id="vNombre"></h2>
<div id="vTags"></div>
<p id="vBio" style="color:#aaa;margin:12px 0;font-size:13px"></p>
<p id="vDist" style="color:#0f0;font-size:12px"></p>
<button onclick="abrirChatDirecto()">💬 Enviar mensaje</button>
<button onclick="toggleFav()" style="background:#222;color:#fff">★ Fav</button>
<div id="chatDirecto" style="display:none;margin-top:15px;border-top:1px solid #222;padding-top:10px">
<div id="mensajes" class="chat-box"></div>
<div class="chat-input"><input id="txtMsg" placeholder="Mensaje..."><button onclick="enviarMsg()" style="width:70px">Enviar</button></div>
</div>
</div>
</div>

<script>
const CLAVE="7M2026";
let perfiles=JSON.parse(localStorage.getItem('perfiles7M')||'[]');
let yo=null,viendo=null,map;
let mensajes=JSON.parse(localStorage.getItem('msgs7M')||'{}');

function dist(lat1,lon1,lat2,lon2){
 const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180;
 const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function login(){
 if(document.getElementById('clave').value!==CLAVE) return alert('Clave mal');
 const n=document.getElementById('nombre').value; if(!n) return alert('Nombre');
 const f=document.getElementById('foto').value||`https://i.pravatar.cc/400?u=${n}`;
 yo={nombre:n,foto:f,id:Date.now(),lat:20.6896+Math.random()*0.02-0.01,lng:-88.2014+Math.random()*0.02-0.01,edad:'',rol:'Vers',bio:'Aquí andamos 7M',gustos:'chelas, tranqui'};
 perfiles=perfiles.filter(p=>p.nombre!==n); perfiles.push(yo);
 localStorage.setItem('perfiles7M',JSON.stringify(perfiles)); localStorage.setItem('yo7M',JSON.stringify(yo)); iniciar();
}
function iniciar(){
 yo=JSON.parse(localStorage.getItem('yo7M')); document.getElementById('login').style.display='none'; document.getElementById('main').style.display='block';
 document.getElementById('miNombreBig').textContent=yo.nombre; document.getElementById('miFotoBig').src=yo.foto;
 document.getElementById('miBioText').textContent=yo.bio; document.getElementById('editBio').value=yo.bio;
 setTimeout(()=>{ map=L.map('map').setView([yo.lat,yo.lng],13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); L.marker([yo.lat,yo.lng]).addTo(map).bindPopup('Tú'); renderCerca(); },300);
 renderChatsList();
}
function renderCerca(){
 const lista=document.getElementById('lista'); lista.innerHTML='';
 let otros=perfiles.filter(p=>p.id!==yo.id).map(p=>{ p._d=dist(yo.lat,yo.lng,p.lat,p.lng); return p; }).sort((a,b)=>a._d-b._d);
 otros.forEach(p=>{
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`<div class="dot"></div><img src="${p.foto}"><div class="info"><b style="font-size:11px">${p.nombre} ${p.edad||''}</b><br><span style="font-size:10px;color:#0f0">${p._d.toFixed(2)} km • ${p.rol||''}</span></div>`;
  el.onclick=()=>verPerfil(p); lista.appendChild(el);
  if(map) L.marker([p.lat,p.lng]).addTo(map).bindPopup(`${p.nombre} - ${p._d.toFixed(2)} km`);
 });
 if(otros.length===0) lista.innerHTML='<p style="grid-column:1/3;text-align:center;color:#555;padding:20px">Solo tú. Pásale el link a la banda</p>';
}
function verPerfil(p){
 viendo=p; document.getElementById('modal').style.display='block';
 document.getElementById('vFoto').src=p.foto; document.getElementById('vNombre').textContent=p.nombre+(p.edad?` ${p.edad}`:'');
 document.getElementById('vBio').textContent=p.bio||'Sin bio'; document.getElementById('vDist').textContent=`📍 ${p._d.toFixed(2)} km de ti • Valladolid`;
 let tags=''; if(p.rol) tags+=`<span class="tag">${p.rol}</span>`; if(p.gustos) p.gustos.split(',').forEach(g=>tags+=`<span class="tag">${g.trim()}</span>`);
 document.getElementById('vTags').innerHTML=tags;
 document.getElementById('chatDirecto').style.display='none'; renderMensajes();
}
function cerrarModal(){ document.getElementById('modal').style.display='none'; viendo=null; }
function abrirChatDirecto(){ document.getElementById('chatDirecto').style.display='block'; renderMensajes(); }
function enviarMsg(){
 if(!viendo) return; const txt=document.getElementById('txtMsg').value; if(!txt) return;
 const key=[yo.nombre,viendo.nombre].sort().join('-');
 if(!mensajes[key]) mensajes[key]=[];
 mensajes[key].push({de:yo.nombre,text:txt,hora:Date.now()});
 localStorage.setItem('msgs7M',JSON.stringify(mensajes)); document.getElementById('txtMsg').value=''; renderMensajes(); renderChatsList();
}
function renderMensajes(){
 if(!viendo) return; const key=[yo.nombre,viendo.nombre].sort().join('-'); const div=document.getElementById('mensajes'); div.innerHTML='';
 (mensajes[key]||[]).forEach(m=>{ div.innerHTML+=`<div class="msg ${m.de===yo.nombre?'me':'other'}">${m.text}</div>` }); div.scrollTop=div.scrollHeight;
}
function renderChatsList(){
 const div=document.getElementById('listaChats'); div.innerHTML='';
 Object.keys(mensajes).forEach(k=>{ const otroNombre=k.split('-').find(n=>n!==yo.nombre); const p=perfiles.find(x=>x.nombre===otroNombre); if(!p) return;
  const last=mensajes[k][mensajes[k].length-1]; div.innerHTML+=`<div class="chat-item" onclick="verPerfil(perfiles.find(x=>x.nombre==='${otroNombre}')); abrirChatDirecto()"><img src="${p.foto}"><div><b>${p.nombre}</b><br><span style="font-size:11px;color:#888">${last.text.slice(0,25)}</span></div></div>`;
 });
 if(div.innerHTML==='') div.innerHTML='<p style="text-align:center;color:#555;padding:30px">Aún no hay chats. Ve a Cerca y mándale mensaje a alguien</p>';
}
function guardarPerfil(){
 yo.edad=document.getElementById('editEdad').value; yo.bio=document.getElementById('editBio').value; yo.gustos=document.getElementById('editGustos').value; yo.rol=document.getElementById('editRol').value;
 localStorage.setItem('yo7M',JSON.stringify(yo)); perfiles=perfiles.map(p=>p.id===yo.id?yo:p); localStorage.setItem('perfiles7M',JSON.stringify(perfiles));
 alert('Guardado');
}
function go(tab,el){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('tab-'+tab).classList.add('active'); document.querySelectorAll('.menu div').forEach(m=>m.classList.remove('active')); el.classList.add('active'); document.getElementById('titulo').textContent=tab.toUpperCase(); if(tab==='cerca'&&map) setTimeout(()=>map.invalidateSize(),200); }
function toggleFav(){ alert('Agregado a favs ⭐'); }
if(localStorage.getItem('yo7M')){ document.getElementById('login').style.display='none'; document.getElementById('main').style.display='block'; iniciar(); }
</script>
</body>
  </html>
